# This file is the base template for CRUD pages; no other template provides this layout
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Finsavvy{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="{%- url 'dashboard' -%}">Finsavvy</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{%- url 'list_veiculo' -%}">Veículos</a></li>
        <li class="nav-item"><a class="nav-link" href="{%- url 'list_custoVariavel' -%}">Custos Variáveis</a></li>
        <li class="nav-item"><a class="nav-link" href="{%- url 'list_custoCompra' -%}">Custos Compras</a></li>
        <li class="nav-item"><a class="nav-link" href="{%- url 'list_custoCombustivel' -%}">Combustível</a></li>
        <li class="nav-item"><a class="nav-link" href="{%- url 'list_manutencao' -%}">Manutenções</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>
</body>
</html>
