{% extends 'pages/base.html' %}
{% block titulo %}Meus Veículos{% endblock %}
{% block body %}
<div class="d-flex justify-content-between mb-3">
    <a href="{% url 'add_veiculo' %}" class="btn btn-primary">Adicionar Veículo</a>
</div>
<table class="table table-dark table-hover">
    <thead>
        <tr>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Placa</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for veiculo in veiculos %}
        <tr>
            <td>{{ veiculo.marca }}</td>
            <td>{{ veiculo.modelo }}</td>
            <td>{{ veiculo.placa }}</td>
            <td>
                <a href="{% url 'edit_veiculo' veiculo.id %}" class="btn btn-sm btn-warning">Editar</a>
                <a href="{% url 'remove_veiculo' veiculo.id %}" class="btn btn-sm btn-danger">Excluir</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
